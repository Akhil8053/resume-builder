{% extends "base.html" %}

{% block title %}CareerCraft | Create Account{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">

    <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-sm">
        
        <div class="text-center mb-6">
            <span class="w-12 h-12 bg-teal-50 text-teal-600 rounded-2xl inline-flex items-center justify-center text-xl mb-3">
                <i class="fa-solid fa-user-plus"></i>
            </span>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Create Your Account</h1>
            <p class="text-xs text-slate-500 mt-1">Join CareerCraft as a Job Seeker or Recruiter.</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center space-x-2">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('register_page') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                <input type="text" name="name" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="Alex Morgan">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="alex@example.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="Create a secure password">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">I am registering as:</label>
                <select name="role" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none bg-white">
                    <option value="applicant">Candidate / Job Seeker</option>
                    <option value="recruiter">Recruiter / Employer</option>
                </select>
            </div>

            <button type="submit" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs shadow-md transition">
                Register Account
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Already have an account? 
            <a href="{{ url_for('login_page') }}" class="text-teal-600 font-bold hover:underline">Sign In</a>
        </div>

    </div>

</div>
{% endblock %}
